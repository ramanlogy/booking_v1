<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumanti Hub | Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #e2e8f0; }
        
        /* Color Psychology Statuses */
        .bg-available { background-color: #ecfdf5; color: #065f46; border: 2px solid #10b981; } 
        .bg-daycation { background-color: #f0f9ff; color: #075985; border: 2px solid #0ea5e9; } 
        .bg-staycation { background-color: #fffbeb; color: #92400e; border: 2px solid #f59e0b; } 
        .bg-busy { background-color: #fef2f2; color: #991b1b; border: 2px solid #f87171; } 

        .big-number { font-size: 2.5rem; font-weight: 900; line-height: 1; letter-spacing: -0.05em; }
        .card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:active { transform: scale(0.97); }
        
        .date-btn.active { background-color: #c9a961; color: white; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(201, 169, 97, 0.3); border-color: #c9a961; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="antialiased select-none overflow-x-hidden">

    <!-- Simple Login -->
    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-white p-6">
        <div class="w-full max-w-sm text-center space-y-10">
            <div class="space-y-3">
                <div class="w-20 h-20 bg-slate-100 rounded-[2rem] flex items-center justify-center text-4xl mx-auto shadow-inner">🏨</div>
                <h1 class="text-4xl font-black tracking-tighter text-[#c9a961]">Lumanti Hub</h1>
                <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest">Employee Login Required</p>
            </div>
            <form id="login-form" class="space-y-4">
                <input type="email" id="email" class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-3xl outline-none focus:border-[#c9a961] font-bold" placeholder="Staff Email" required>
                <input type="password" id="password" class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-3xl outline-none focus:border-[#c9a961] font-bold" placeholder="Access Key" required>
                <button type="submit" class="w-full py-5 bg-[#0f172a] text-white rounded-[2rem] font-black text-xl shadow-xl active:scale-95 transition-all">Unlock Portal</button>
                <p id="login-error" class="text-red-500 text-xs hidden font-bold"></p>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="app" class="hidden min-h-screen pb-12">
        <header class="sticky top-0 z-50 glass px-4 py-4 md:px-8">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-2xl hidden md:inline">👋</span>
                    <h2 class="text-2xl font-black text-[#c9a961] tracking-tighter cursor-pointer" onclick="location.reload()">Lumanti</h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="openQRScanner()" class="p-3 bg-slate-100 rounded-xl border-2 border-slate-200" title="Scan QR Code">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                    </button>
                    <button onclick="openBookingModal()" class="px-5 py-3 bg-[#c9a961] text-white rounded-xl font-black text-sm shadow-lg active:scale-95 transition-all">+ New</button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-10">

            <!-- Global Insights (Small & Visible on Mobile) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-[2rem] border-2 border-slate-100 shadow-sm">
                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Daily Yield</p>
                    <p class="text-xl font-black" id="stat-daily-rev">Rs 0</p>
                </div>
                <div class="bg-white p-5 rounded-[2rem] border-2 border-slate-100 shadow-sm">
                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Bookings</p>
                    <p class="text-xl font-black" id="stat-total-bookings">0</p>
                </div>
                <div class="bg-daycation p-5 rounded-[2rem] shadow-sm flex flex-col">
                    <p class="text-[9px] font-black opacity-60 uppercase tracking-widest mb-1">Left: Day</p>
                    <p class="text-xl font-black" id="left-day">0</p>
                </div>
                <div class="bg-staycation p-5 rounded-[2rem] shadow-sm flex flex-col">
                    <p class="text-[9px] font-black opacity-60 uppercase tracking-widest mb-1">Left: Stay</p>
                    <p class="text-xl font-black" id="left-stay">0</p>
                </div>
            </div>

            <!-- Date Scroller -->
            <div class="space-y-3">
                <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest ml-2">Operational Date</h3>
                <div id="date-scroll" class="flex gap-3 overflow-x-auto pb-4 no-scrollbar snap-x">
                    <!-- Dates -->
                </div>
            </div>

            <!-- Inventory Grid -->
            <div class="space-y-4">
                <h3 class="text-xl font-black ml-2">Room Availability</h3>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4" id="matrix-grid">
                    <!-- Room Matrix -->
                </div>
            </div>

            <!-- Live Feeds Section (Critical Request) -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- Daily Guests (Operational) -->
                <div class="space-y-6">
                    <div class="flex items-center justify-between ml-2">
                        <h3 class="text-xl font-black">Daily Guest List</h3>
                        <div class="flex bg-slate-100 p-1 rounded-xl">
                            <button onclick="setFilter('all')" id="f-all" class="px-4 py-1.5 rounded-lg text-[10px] font-black bg-white shadow-sm">All</button>
                            <button onclick="setFilter('pending')" id="f-pending" class="px-4 py-1.5 rounded-lg text-[10px] font-black text-slate-500">Waiting</button>
                        </div>
                    </div>
                    <div id="guest-list" class="space-y-4">
                        <!-- Daily Guests -->
                    </div>
                </div>

                <!-- Global Recent Activity (The "Whenever New Comes" Feed) -->
                <div class="space-y-6">
                    <div class="flex items-center justify-between ml-2">
                        <h3 class="text-xl font-black flex items-center gap-2">
                            Recent Activity <span class="w-2 h-2 bg-emerald-500 rounded-full pulse-soft"></span>
                        </h3>
                    </div>
                    <div id="recent-activity-feed" class="space-y-4 bg-slate-50/50 p-4 rounded-[2.5rem] border-2 border-dashed border-slate-200 min-h-[400px]">
                        <!-- Global Feed (Any Date) -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Booking Modal -->
    <div id="booking-modal" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md overflow-y-auto">
        <div class="bg-white w-full max-w-xl rounded-[3rem] p-8 shadow-2xl relative my-auto">
            <button onclick="closeModals()" class="absolute top-6 right-6 text-slate-300 hover:text-slate-900 text-3xl font-black">×</button>
            <h3 class="text-2xl font-black mb-8" id="modal-title">Create Reservation</h3>
            
            <form id="booking-form" class="space-y-5">
                <div class="space-y-3">
                    <input type="text" id="b-name" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold outline-none focus:border-[#c9a961]" placeholder="Guest Full Name" required>
                    <input type="tel" id="b-phone" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold outline-none focus:border-[#c9a961]" placeholder="Phone Number" required>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Category</label>
                            <select id="b-room" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold outline-none appearance-none">
                                <option value="Mini">Mini Room</option>
                                <option value="Classic">Classic Room</option>
                                <option value="Deluxe">Deluxe Room</option>
                                <option value="Suite">Suite Room</option>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Stay Mode</label>
                            <select id="b-type" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold outline-none appearance-none">
                                <option value="Daycation">Daycation</option>
                                <option value="Staycation">Staycation</option>
                                <option value="Full Stay">Full Stay</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" id="b-date" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold outline-none" required>
                        <input type="time" id="b-time" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold outline-none">
                    </div>

                    <div class="p-5 bg-slate-900 rounded-[2rem] text-white flex justify-between items-center">
                        <div class="space-y-1">
                            <p class="text-[8px] font-black text-[#c9a961] uppercase tracking-widest">Pricing (Rs)</p>
                            <input type="number" id="b-amount" class="bg-transparent text-xl font-black w-24 outline-none border-b border-white/10" placeholder="0">
                        </div>
                        <div class="flex gap-3">
                            <label class="flex items-center gap-1.5"><input type="radio" name="pay-status" value="paid" class="w-4 h-4 accent-[#c9a961]"><span class="text-xs font-bold">Paid</span></label>
                            <label class="flex items-center gap-1.5"><input type="radio" name="pay-status" value="unpaid" class="w-4 h-4 accent-[#c9a961]" checked><span class="text-xs font-bold">Unpaid</span></label>
                        </div>
                    </div>

                    <select id="b-status" class="w-full p-4 bg-slate-100 rounded-2xl font-black border-none appearance-none">
                        <option value="pending">Waiting Arrival</option>
                        <option value="checked-in">Checked In</option>
                        <option value="checked-out">Checked Out</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-5 bg-[#0f172a] text-white rounded-[2rem] font-black text-lg shadow-xl active:scale-95 transition-all">Submit Now</button>
            </form>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="fixed inset-0 z-[120] hidden items-center justify-center p-4 bg-slate-900/80 backdrop-blur-xl">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center space-y-6">
            <h3 class="text-xl font-black uppercase tracking-wider">Point Camera</h3>
            <div id="qr-reader" class="rounded-[2rem] overflow-hidden bg-slate-50 aspect-square border-4 border-slate-100 shadow-inner"></div>
            <button onclick="closeModals()" class="w-full py-4 bg-slate-100 rounded-2xl font-black uppercase text-xs">Dismiss</button>
        </div>
    </div>

    <script type="module">
        const SUPABASE_URL = 'https://fzwnglhxtmtltpysdzma.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6d25nbGh4dG10bHRweXNkem1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1ODE0MzAsImV4cCI6MjA4NDE1NzQzMH0.PuES2nphqkKU-FqzBge6LlptVibSfeTQcUExEdfTleg';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allBookings = [];
        let selectedDate = new Date().toISOString().split('T')[0];
        let currentFilter = 'all';
        let qrScanner = null;

        const ROOM_CAPACITY = { Mini: 3, Classic: 6, Deluxe: 3, Suite: 3 };
        const ROOM_TYPES = ['Mini', 'Classic', 'Deluxe', 'Suite'];

        // Auth
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.textContent = 'Verifying...';
            const { error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            if (!error) initApp();
            else {
                btn.textContent = 'Unlock Portal';
                document.getElementById('login-error').classList.remove('hidden');
                document.getElementById('login-error').textContent = "Access Denied: Check credentials";
            }
        });

        async function initApp() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                initDateNav();
                loadData();
                supabase.channel('bookings-all').on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => loadData()).subscribe();
            }
        }

        function initDateNav() {
            const container = document.getElementById('date-scroll');
            const today = new Date();
            let html = '';
            for (let i = -1; i < 21; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const ds = d.toISOString().split('T')[0];
                const active = ds === selectedDate ? 'active' : '';
                const label = i === 0 ? 'Today' : (i === 1 ? 'Tmro' : d.toLocaleDateString('en-US', { weekday: 'short' }));
                html += `
                    <button onclick="selectDate('${ds}')" class="date-btn ${active} snap-center flex-shrink-0 px-6 py-3.5 bg-white rounded-2xl border-2 border-slate-100 flex flex-col items-center min-w-[90px] transition-all">
                        <span class="text-[9px] font-black uppercase opacity-40 mb-0.5">${label}</span>
                        <span class="text-base font-black">${d.getDate()}</span>
                    </button>`;
            }
            container.innerHTML = html;
        }

        window.selectDate = (date) => {
            selectedDate = date;
            initDateNav();
            renderDashboard();
        };

        async function loadData() {
            const { data } = await supabase.from('bookings').select('*').order('created_at', { ascending: false });
            allBookings = data || [];
            renderDashboard();
            renderRecentFeed();
            renderStats();
        }

        function renderStats() {
            // Simplified global stats
            const todayBookings = allBookings.filter(b => b.check_in_date === selectedDate);
            const totalRev = todayBookings.reduce((s,b) => s + (b.total_amount || 0), 0);
            document.getElementById('stat-daily-rev').textContent = `Rs ${totalRev.toLocaleString()}`;
            document.getElementById('stat-total-bookings').textContent = allBookings.length;
        }

        function renderDashboard() {
            const activeOnDate = allBookings.filter(b => b.check_in_date === selectedDate && b.status !== 'cancelled' && b.status !== 'checked-out');
            
            // Availability Calculation
            const matrix = {};
            ROOM_TYPES.forEach(t => matrix[t] = { count: 0 });
            activeOnDate.forEach(b => { if(matrix[b.room_type]) matrix[b.room_type].count++; });

            const totalCapacity = Object.values(ROOM_CAPACITY).reduce((a, b) => a + b, 0);
            const left = Math.max(0, totalCapacity - activeOnDate.length);
            document.getElementById('left-day').textContent = left;
            document.getElementById('left-stay').textContent = left;

            // Room Grid
            const grid = document.getElementById('matrix-grid');
            grid.innerHTML = ROOM_TYPES.map(type => {
                const avail = ROOM_CAPACITY[type] - matrix[type].count;
                const statusClass = avail <= 0 ? 'bg-busy' : 'bg-available';
                return `
                    <div onclick="${avail > 0 ? `openBookingModalWithPrefill('${type}', '${selectedDate}')` : ''}" 
                         class="card p-5 rounded-[2rem] ${statusClass} flex flex-col items-center text-center space-y-1 shadow-sm border-2 cursor-pointer">
                        <h4 class="text-sm font-black uppercase tracking-tight">${type}</h4>
                        <span class="text-xs font-bold opacity-60">${avail > 0 ? `${avail} LEFT` : 'FULL'}</span>
                    </div>`;
            }).join('');

            renderDailyGuestList();
        }

        function renderDailyGuestList() {
            const list = document.getElementById('guest-list');
            let filtered = allBookings.filter(b => b.check_in_date === selectedDate);
            if (currentFilter !== 'all') filtered = filtered.filter(b => b.status === currentFilter);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="p-10 text-center text-slate-300 font-bold border-2 border-dashed border-slate-100 rounded-[2rem]">No arrivals scheduled</div>`;
                return;
            }

            list.innerHTML = filtered.map(b => `
                <div class="bg-white p-5 rounded-[2rem] border-2 border-slate-100 flex justify-between items-center shadow-sm">
                    <div class="overflow-hidden">
                        <h4 class="text-sm font-black truncate">${b.full_name}</h4>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${b.room_type} • ${b.stay_type}</p>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="openBookingModalWithPrefill('', '', '${b.id}')" class="p-3 bg-slate-50 rounded-xl text-xs" title="Details">ℹ️</button>
                        ${b.status === 'pending' ? `<button onclick="updateStatus('${b.id}', 'checked-in')" class="p-3 bg-emerald-50 text-emerald-600 rounded-xl text-xs font-black">IN</button>` : ''}
                        ${b.status === 'checked-in' ? `<button onclick="updateStatus('${b.id}', 'checked-out')" class="p-3 bg-slate-900 text-white rounded-xl text-xs font-black">OUT</button>` : ''}
                    </div>
                </div>`).join('');
        }

        // New Feature: The Global Feed
        function renderRecentFeed() {
            const feed = document.getElementById('recent-activity-feed');
            const sortedByCreated = [...allBookings].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 8);

            if (sortedByCreated.length === 0) {
                feed.innerHTML = `<div class="p-10 text-center text-slate-300 font-bold">Activity will appear here</div>`;
                return;
            }

            feed.innerHTML = sortedByCreated.map(b => {
                const isToday = b.check_in_date === new Date().toISOString().split('T')[0];
                return `
                <div class="flex gap-4 p-4 bg-white/60 border border-white rounded-2xl shadow-sm transition-all hover:bg-white cursor-pointer" onclick="openBookingModalWithPrefill('', '', '${b.id}')">
                    <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-lg shrink-0">✨</div>
                    <div class="flex-1 overflow-hidden">
                        <div class="flex justify-between items-start">
                            <h5 class="text-xs font-black truncate">${b.full_name}</h5>
                            <span class="text-[8px] font-black text-[#c9a961] uppercase">${b.stay_type}</span>
                        </div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase mt-0.5">Reservation for: <span class="${isToday ? 'text-emerald-500' : ''}">${b.check_in_date}</span></p>
                    </div>
                </div>`;
            }).join('');
        }

        window.openBookingModal = () => {
            document.getElementById('booking-form').reset();
            document.getElementById('modal-title').textContent = 'New Booking';
            document.getElementById('b-date').value = selectedDate;
            document.getElementById('booking-modal').classList.remove('hidden');
            document.getElementById('booking-modal').classList.add('flex');
        };

        window.openBookingModalWithPrefill = (room = '', date = '', duplicateId = '') => {
            openBookingModal();
            if (room) document.getElementById('b-room').value = room;
            if (date) document.getElementById('b-date').value = date;
            
            if (duplicateId) {
                const b = allBookings.find(x => x.id === duplicateId);
                if (b) {
                    document.getElementById('b-name').value = b.full_name;
                    document.getElementById('b-phone').value = b.phone_number;
                    document.getElementById('b-room').value = b.room_type;
                    document.getElementById('b-type').value = b.stay_type;
                    document.getElementById('b-amount').value = b.total_amount;
                    document.getElementById('b-date').value = b.check_in_date;
                    document.getElementById('modal-title').textContent = 'Booking Details';
                }
            }
        };

        window.closeModals = () => {
            document.querySelectorAll('[id$="-modal"]').forEach(m => {
                m.classList.add('hidden');
                m.classList.remove('flex');
            });
            if (qrScanner) { qrScanner.stop(); qrScanner = null; }
        };

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                full_name: document.getElementById('b-name').value,
                phone_number: document.getElementById('b-phone').value,
                room_type: document.getElementById('b-room').value,
                stay_type: document.getElementById('b-type').value,
                check_in_date: document.getElementById('b-date').value,
                arrival_time: document.getElementById('b-time').value,
                status: document.getElementById('b-status').value,
                total_amount: parseFloat(document.getElementById('b-amount').value) || 0,
                payment_status: document.querySelector('input[name="pay-status"]:checked').value
            };

            const { error } = await supabase.from('bookings').insert([payload]);
            if (!error) { closeModals(); loadData(); } else { alert("Booking Error: Check inputs"); }
        });

        window.updateStatus = async (id, status) => {
            await supabase.from('bookings').update({ status }).eq('id', id);
            loadData();
        };

        window.setFilter = (f) => {
            currentFilter = f;
            document.querySelectorAll('[id^="f-"]').forEach(el => el.className = 'px-4 py-1.5 rounded-lg text-[10px] font-black text-slate-500');
            document.getElementById(`f-${f}`).className = 'px-4 py-1.5 rounded-lg text-[10px] font-black bg-white shadow-sm';
            renderDailyGuestList();
        };

        window.openQRScanner = () => {
            document.getElementById('qr-modal').classList.remove('hidden');
            document.getElementById('qr-modal').classList.add('flex');
            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (id) => {
                closeModals();
                openBookingModalWithPrefill('', '', id);
            }).catch(() => {});
        };

        initApp();
    </script>
</body>
